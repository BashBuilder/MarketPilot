# Local stack: Postgres (pgvector) and Redis only.
# backend and frontend are placeholders until their Dockerfiles land.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpilot}
      POSTGRES_DB: ${POSTGRES_DB:-marketpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketpilot} -d ${POSTGRES_DB:-marketpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend:
  #   build: ./backend
  #   env_file: ./backend/.env
  #   ports: ["8000:8000"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }

  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
  #   depends_on: [backend]

volumes:
  postgres-data:
  redis-data:
